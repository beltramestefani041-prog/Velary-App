<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velary - Saúde Feminina</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #fff5f8; 
            color: #8a2b5d; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 300px;
        }
        h1 { color: #d02090; margin-bottom: 10px; }
        button {
            background-color: #d02090;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #a01870; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Velary</h1>
        <p>Seu assistente de saúde e ciclo menstrual.</p>
        <button>Entrar no App</button>
    </div>
</body>
</html>
